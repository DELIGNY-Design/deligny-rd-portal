# STATIC_FORTRESS — profil nginx pour deligny-rd.fr (portail statique).
# Préparé le 26/07/2026, PAS déployé (aucun accès OVH depuis cette machine).
# À adapter (chemin racine, cert path) puis appliquer par Baptiste.
#
# Ce profil couvre volontairement MOINS que la checklist Atlas Fortress
# complète (Vigie/Gardien/Watchdog, chiffrement DB, TOTP, honeytokens...) :
# ce portail n'a ni base de données, ni auth, ni paiement — sa surface
# d'attaque réelle est "servir du HTML statique sans se faire défigurer",
# pas "protéger des données bancaires/paie". Cf analyse du 26/07.

server {
    listen 80;
    listen [::]:80;
    server_name deligny-rd.fr www.deligny-rd.fr;
    return 301 https://deligny-rd.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deligny-rd.fr www.deligny-rd.fr;

    # --- HTTPS ---------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/deligny-rd.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deligny-rd.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # www -> apex (canonique)
    if ($host = www.deligny-rd.fr) { return 301 https://deligny-rd.fr$request_uri; }

    # --- HSTS + en-têtes de sécurité ------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP resserrée : site 100% statique, pas de JS externe, pas de CDN.
    # 'unsafe-inline' pour le style uniquement (feuilles <style> inline du
    # portail) — pas de script inline, pas de eval.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    root /var/www/deligny-rd.fr;
    index index.html;

    access_log /var/log/nginx/deligny-rd.fr.access.log;
    error_log  /var/log/nginx/deligny-rd.fr.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Aucun .git, .env, backup ou fichier de config exposé.
    location ~ /\. { deny all; }
    location ~ \.(env|bak|old|log)$ { deny all; }
}
